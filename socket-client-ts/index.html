<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalla Friki</title>
</head>
<body>
    <div id="app">
        <h1>BATALLA FRIKI</h1>

        <div id="auth-section" class="panel">
            <h2>Acceso</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button id="btnLogin">Entrar</button>
            <p id="loginStatus" class="error"></p>
        </div>

        <div id="admin-section" class="panel hidden">
            <div class="header">
                <h2>Panel Admin</h2>
                <button class="btn-logout">Salir</button>
            </div>
            
            <div class="grid">
                <div>
                    <h3>Crear Usuario</h3>
                    <div class="form-row">
                        <input id="new-nick" placeholder="Nick">
                        <input id="new-email" placeholder="Email">
                        <input id="new-pass" type="password" placeholder="Password">
                        
                        <label style="font-size: 0.8em; color: #aaa;">Rol:</label>
                        <select id="new-role">
                            <option value="USER">Jugador (USER)</option>
                            <option value="ADMIN">Administrador</option>
                        </select>

                        <button id="btnCreateUser">Crear Usuario</button>
                    </div>
                    <ul id="users-list" class="list"></ul>
                </div>

                <div>
                    <h3>Crear Personaje</h3>
                    <div class="form-row">
                        <input id="char-name" placeholder="Nombre">
                        <div style="display: flex; gap: 5px;">
                            <input id="char-hp" type="number" placeholder="Vida">
                            <input id="char-atk" type="number" placeholder="Ataque">
                        </div>
                        
                        <input id="char-level" type="number" placeholder="Nivel (Ej: 1, 10...)" value="1">
                        
                        <button id="btnCreateChar">Crear Personaje</button>
                    </div>
                    <ul id="chars-list" class="list"></ul>
                </div>
            </div>
        </div>

        <div id="game-section" class="hidden">
            <div id="setup-panel" class="panel">
                <div class="header">
                    <h2>Configuracion</h2>
                    <button class="btn-logout">Salir</button>
                </div>
                <p>Jugador: <span id="playerName" style="color: yellow; font-weight: bold;"></span></p>
                
                <label>Elige tu Personaje:</label>
                <select id="select-hero"></select>

                <label>Oponente:</label>
                <select id="select-mode">
                    <option value="CPU">Contra la CPU</option>
                </select>

                <button id="btnStartGame" class="btn-primary">INICIAR BATALLA</button>
                <p id="gameError" class="error"></p>
            </div>

            <div id="arena-panel" class="panel hidden">
                <div class="fighters">
                    <div class="fighter">
                        <h3 id="p1-name">Jugador</h3>
                        <div class="bar-bg"><div id="p1-bar" class="bar-fill"></div></div>
                        <p>HP: <span id="p1-val"></span> | ATQ: <span id="p1-atk"></span></p>
                    </div>
                    <div class="vs">VS</div>
                    <div class="fighter">
                        <h3 id="p2-name">Rival</h3>
                        <div class="bar-bg"><div id="p2-bar" class="bar-fill enemy"></div></div>
                        <p>HP: <span id="p2-val"></span> | ATQ: <span id="p2-atk"></span></p>
                    </div>
                </div>

                <div class="actions">
                    <button id="btnAttack" class="btn-attack">ATACAR</button>
                    <button id="btnRestart" class="hidden">Nueva Partida</button>
                </div>

                <div class="logs">
                    <ul id="battle-logs"></ul>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
